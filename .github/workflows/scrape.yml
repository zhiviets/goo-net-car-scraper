name: Japan (goo-net) scrape

# Объявления goo-net.com → bn-auto (раздел «Авто из Японии»), см. japan_scraper.py.
# Нужны секреты репозитория BN_AUTO_URL и BN_AUTO_IMPORT_TOKEN (те же, что у Кореи и Китая);
# без них сборщик только собирает и печатает, ничего не отправляя.
on:
  schedule:
    # Пока каталог не заполнен (6000 машин), прогоны идут друг за другом без остановки: каждый
    # в конце запускает следующий (шаг «Next fill run»); расписание — страховка, если цепочка
    # оборвётся. После заполнения — обновление по средам и субботам (первый прогон дня,
    # порции по 150 с паузой 30 минут), в остальное время прогон сразу заканчивается.
    - cron: "0 5,13,21 * * *"
  workflow_dispatch:
    inputs:
      total:
        description: "Сколько новых машин добавить (0 — само: заполнение до 6000, потом 2 раза в неделю)"
        default: "0"
      minutes:
        description: "Сколько минут обходить марки и модели (для проверки хватит 5)"
        default: "90"
      models:
        description: "Для проверки: сколько моделей обойти (0 — все)"
        default: "0"

# Один прогон за раз: запуск по расписанию ждёт, пока закончится предыдущий
# (два параллельных прогона — двойная нагрузка на сайт-источник и риск блокировки)
concurrency:
  group: goonet-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Обход (до 1,5 ч) + до 1000 машин порциями по 100 с паузой 1–2 минуты
    timeout-minutes: 355
    # actions: write — запустить следующий прогон, пока каталог не заполнен
    permissions:
      contents: read
      actions: write
    steps:
      # Время старта — шаг «Next fill run» по нему отличает падение сразу при старте
      - name: Remember start time
        run: echo "RUN_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install "httpx>=0.27,<1.0" "beautifulsoup4>=4.12,<5.0" "lxml>=5.0,<6.0" "pillow>=10"
      - name: Scrape goo-net and push to bn-auto
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          BN_AUTO_URL: ${{ secrets.BN_AUTO_URL }}
          BN_AUTO_IMPORT_TOKEN: ${{ secrets.BN_AUTO_IMPORT_TOKEN }}
          GOONET_TOTAL: ${{ inputs.total || '0' }}
          GOONET_SCAN_MINUTES: ${{ inputs.minutes || '90' }}
          GOONET_MAX_MODELS: ${{ inputs.models || '0' }}
        run: python japan_scraper.py
      - name: Upload batch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goonet-batch
          path: goonet_batch.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Next fill run
        # Следующий прогон — и после ошибки (сайт не ответил, сбой), иначе цепочка стоит до
        # расписания. Но если прогон упал раньше 20 минут — ошибка при старте, её перезапуск
        # ничего не даст: ждём расписания, чтобы не крутить падения по кругу.
        if: ${{ !cancelled() && hashFiles('continue_fill') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          elapsed=$(( $(date +%s) - ${RUN_STARTED:-0} ))
          if [ "$JOB_STATUS" != "success" ] && [ "$elapsed" -lt 1200 ]; then
            echo "Прогон упал через $((elapsed / 60)) мин — следующий не запускаем, ждём расписания"
            exit 0
          fi
          gh workflow run scrape.yml --ref main -R ${{ github.repository }}
