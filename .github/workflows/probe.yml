name: Goo-net probe

# Разовая проверка подбора мощности с drom.ru на настоящих объявлениях goo-net
# (см. probe.py). Ничего никуда не отправляет.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Какой скрипт проверки запустить"
        default: "probe.py"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install "httpx>=0.27,<1.0" "beautifulsoup4>=4.12,<5.0" "lxml>=5.0,<6.0" "pillow>=10" "playwright>=1.47,<2.0"
          python -m playwright install --with-deps chromium
      # Кэш drom.ru основного сборщика — только читаем, чтобы не открывать те же страницы заново
      - name: Restore drom.ru cache
        uses: actions/cache/restore@v4
        with:
          path: drom_cache.json
          key: drom-cache-probe-${{ github.run_id }}
          restore-keys: drom-cache-
      - name: Probe drom.ru matching on goo-net listings
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUNBUFFERED: "1"
          SCRIPT: ${{ inputs.script || 'probe.py' }}
          BN_AUTO_URL: ${{ secrets.BN_AUTO_URL }}
          BN_AUTO_IMPORT_TOKEN: ${{ secrets.BN_AUTO_IMPORT_TOKEN }}
        run: python "$SCRIPT"
